<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Street Nova - Contacto</title>
</head>
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; display: flex; flex-direction: column; min-height: 100vh;">

    <header style="background-color: #1a1a1d; color: #c3073f; padding: 30px; text-align: center;">
        <h1 style="margin: 0; font-size: 2.5em; text-transform: uppercase; letter-spacing: 2px;">Street Nova</h1>
        <p style="color: #fff; margin-top: 10px;">Trabaja con Nosotros</p>
    </header>

    <nav style="background-color: #c3073f; padding: 15px; text-align: center;">
        <a href="index.html" style="color: white; text-decoration: none; margin: 0 15px; font-weight: bold;">Inicio</a>
        <a href="about.html" style="color: white; text-decoration: none; margin: 0 15px; font-weight: bold;">Nuestra Esencia</a>
        <a href="contact.html" style="color: white; text-decoration: none; margin: 0 15px; font-weight: bold;">Contacto</a>
    </nav>

    <main style="padding: 40px; text-align: center; flex: 1;">
        <h2>Haz tu pedido o consulta</h2>
        <p>¿Necesitas un logo, un flyer o te interesa nuestra ropa? Escríbenos.</p>
        
        <form style="max-width: 400px; margin: 20px auto; background-color: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: left;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Nombre:</label>
            <input type="text" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" placeholder="Tu nombre">
            
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Motivo:</label>
            <select style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
                <option>Diseño de Logotipo</option>
                <option>Flyer Promocional</option>
                <option>Ropa Urbana</option>
                <option>Otros</option>
            </select>

            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Mensaje:</label>
            <textarea style="width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; resize: vertical;" rows="4" placeholder="Cuéntanos tu idea..."></textarea>

            <button type="button" style="width: 100%; padding: 12px; background-color: #1a1a1d; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase;">Enviar Mensaje</button>
        </form>
    </main>

    <footer style="background-color: #1a1a1d; color: #fff; padding: 15px; text-align: center;">
        <p style="font-size: 14px; margin: 0;">&copy; 2026 Street Nova. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
